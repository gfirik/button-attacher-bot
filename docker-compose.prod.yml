version: '3.8'

# Production configuration for Netcup VPS deployment

services:
  bot:
    image: button-attach-bot:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: button-attach-bot
    restart: always
    env_file:
      - .env.prod
    environment:
      - RUST_LOG=info
      - DATABASE_URL=/app/data/bot.db
    volumes:
      - bot_data:/app/data
    # Production resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 64M
    # Security hardening
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=10M,mode=1777
    # Logging configuration
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Network isolation
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge

volumes:
  bot_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/button-attach-bot/data
